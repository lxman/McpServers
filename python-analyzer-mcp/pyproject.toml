[project]
name = "python-analyzer-mcp"
version = "1.0.0"
description = "MCP server that exposes Python code analysis capabilities"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.29.0",
    "pylint>=3.3.9",
    "pyflakes>=3.4.0",
    "mypy>=1.19.1",
    "astroid>=3.3.11",
    "black>=25.12.0",
    "autopep8>=2.3.2",
    "radon>=6.0.1",
    "mccabe>=0.7.0",
    "vulture>=2.16",
    "jedi>=0.19.2",
    "typing-extensions>=4.16.0",
    # Required by http_server.py; previously declared only in requirements.txt.
    "Flask>=3.1.3",
    "flask-restx>=1.3.2",
    "flask-cors>=6.0.5",
]

[project.scripts]
python-analyzer-mcp = "src.main:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pylint.main]
py-version = "3.10"
ignore-patterns = ["test_.*?.py"]

[tool.pylint.messages_control]
max-line-length = 100
